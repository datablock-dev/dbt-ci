version: 2

# Dependencies are declared in pyproject.toml; the Pipfile installs the project itself
# rather than restating them. Pointing the pip ecosystem at the repository root makes
# dependabot update pyproject.toml - the manifest that CI, the Docker image and PyPI
# releases all build from - instead of a parallel list that nothing consumes.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      # Patch and minor bumps for the test and lint tooling rarely need individual
      # review, so they arrive as one pull request.
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
