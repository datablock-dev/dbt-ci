name: Tests (Reusable)

on:
  workflow_call:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: [ ubuntu-latest ]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        dbt-version: ["1.10.13", "1.11.5"]
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install dbt-core==${{ matrix.dbt-version }}
        pip install -e ".[dev]"
    
    - name: Run tests with dbt-core ${{ matrix.dbt-version }}
      run: pytest -v --cov=dbt_ci --cov-report=xml --cov-report=term
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella-dbt-${{ matrix.dbt-version }}
        fail_ci_if_error: false
