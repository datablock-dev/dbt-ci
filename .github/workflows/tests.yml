name: Tests (Reusable)

on:
  workflow_call:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        dbt-version: ["1.10.23", "1.11.15", "1.12.5"]
        # dbt-core declares Python 3.14 support from 1.12 onwards.
        include:
          - python-version: "3.14"
            dbt-version: "1.12.5"
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install dbt-core==${{ matrix.dbt-version }}
        pip install -e ".[dev]"
        # dbt-duckdb lets the e2e tests run a real project; pin dbt-core so it stays on the matrix version.
        pip install dbt-duckdb "dbt-core==${{ matrix.dbt-version }}"
    
    - name: Run tests with dbt-core ${{ matrix.dbt-version }}
      run: |
        export DBT_CI_E2E_DBT_BINARY="$(command -v dbt)"
        pytest -v --cov=dbt_ci --cov-report=xml --cov-report=term
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella-dbt-${{ matrix.dbt-version }}
        fail_ci_if_error: false

  test-dbt-v2:
    # dbt v2 installs its own `dbt` package and executable, so it cannot share an
    # environment with the dbt-core that dbt-ci depends on. It gets its own venv and
    # dbt-ci drives it through the local runner, which is how users run it too.
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install dbt-ci
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Install dbt v2 in its own environment
      run: |
        python -m venv "$RUNNER_TEMP/dbt-v2"
        "$RUNNER_TEMP/dbt-v2/bin/pip" install "dbt==2.0.6"
        "$RUNNER_TEMP/dbt-v2/bin/dbt" --version

    - name: Install dbt-core 1.x in its own environment
      run: |
        python -m venv "$RUNNER_TEMP/dbt-v1"
        "$RUNNER_TEMP/dbt-v1/bin/pip" install "dbt-core==1.12.5" dbt-duckdb

    - name: Run end-to-end tests with dbt v2
      run: |
        export DBT_CI_E2E_DBT_BINARY="$RUNNER_TEMP/dbt-v2/bin/dbt"
        pytest -v tests/e2e

    - name: Run end-to-end tests with dbt v2 against state built by dbt-core 1.x
      run: |
        export DBT_CI_E2E_DBT_BINARY="$RUNNER_TEMP/dbt-v2/bin/dbt"
        export DBT_CI_E2E_REFERENCE_DBT_BINARY="$RUNNER_TEMP/dbt-v1/bin/dbt"
        pytest -v tests/e2e/test_dbt_versions.py

  test-docker-runner:
    # Many users run dbt-ci with --runner docker, so the e2e tests also drive dbt through
    # the Docker runner: a dbt v2 image, the mid-upgrade case against state built by
    # dbt-core 1.x, and a dbt-core 1.x image. tests/e2e/docker/Dockerfile builds images
    # with dbt as the entrypoint, like the official dbt images.
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install dbt-ci
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Build dbt images
      run: |
        docker build -t dbt-ci-e2e:v2 --build-arg DBT_PACKAGES="dbt==2.0.6" tests/e2e/docker
        docker build -t dbt-ci-e2e:v1 --build-arg DBT_PACKAGES="dbt-core==1.12.5 dbt-duckdb" tests/e2e/docker
        docker run --rm dbt-ci-e2e:v2 --version
        docker run --rm dbt-ci-e2e:v1 --version

    - name: Install dbt-core 1.x for the mid-upgrade state
      run: |
        python -m venv "$RUNNER_TEMP/dbt-v1"
        "$RUNNER_TEMP/dbt-v1/bin/pip" install "dbt-core==1.12.5" dbt-duckdb

    - name: Run end-to-end tests through the Docker runner with dbt v2
      env:
        DBT_CI_E2E_DOCKER_IMAGE: dbt-ci-e2e:v2
      run: pytest -v tests/e2e

    - name: Run end-to-end tests through the Docker runner with dbt v2 against state built by dbt-core 1.x
      env:
        DBT_CI_E2E_DOCKER_IMAGE: dbt-ci-e2e:v2
      run: |
        export DBT_CI_E2E_REFERENCE_DBT_BINARY="$RUNNER_TEMP/dbt-v1/bin/dbt"
        pytest -v tests/e2e/test_dbt_versions.py

    - name: Run end-to-end tests through the Docker runner with dbt-core 1.x
      env:
        DBT_CI_E2E_DOCKER_IMAGE: dbt-ci-e2e:v1
      run: pytest -v tests/e2e
