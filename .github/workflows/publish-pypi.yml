name: Publish to PyPI (Reusable)

on:
  workflow_call:
    secrets:
      semantic_release_token:
        description: 'Token for semantic release'
        required: true
      pypi_token:
        description: 'Token for PyPI publishing'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
        persist-credentials: true
        token: ${{ secrets.semantic_release_token }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install python-semantic-release
        pip install -e ".[dev]"
    
    - name: Run tests
      run: |
        pytest -v --cov=src --cov-report=xml --cov-report=term
    
    - name: Semantic Release
      id: release
      env:
        GH_TOKEN: ${{ secrets.semantic_release_token }}
      uses: python-semantic-release/publish-action@v9.14.0
      with:
        github_token: ${{ secrets.semantic_release_token }}
    
    - name: Build package
      if: steps.release.outputs.released == 'true'
      run: |
        python -m pip install --upgrade build
        python -m build
    
    - name: Publish to PyPI
      if: steps.release.outputs.released == 'true'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.pypi_token }}