name: Publish to PyPI (Reusable)

on:
  workflow_call:

jobs:
  release:
    runs-on: ubuntu-24.04
    # One release at a time: two merges in quick succession otherwise race, and the
    # second run finds the first one's tag already on its commit.
    concurrency:
      group: pypi-release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    
    steps:
    - uses: actions/checkout@v7
      with:
        # Release the latest main rather than the commit that triggered this run, so a
        # queued run includes everything merged meanwhile and can push its bump on top.
        ref: main
        fetch-depth: 0
        persist-credentials: true
        token: ${{ secrets.ORG_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
        pip install -e ".[dev]"

    - name: Run tests
      run: |
        pytest -v --cov=src --cov-report=xml --cov-report=term

    - name: Determine next release version
      id: release_version
      uses: ietf-tools/semver-action@v1.11.0
      with:
        token: ${{ secrets.ORG_TOKEN }}
        patchAll: true
        noVersionBumpBehavior: patch
        # An earlier queued run may already have released these commits.
        noNewCommitBehavior: silent
        fallbackTag: v1.0.0

    - name: Bump version in pyproject.toml
      if: steps.release_version.outputs.next != ''
      run: |
        VERSION="${{ steps.release_version.outputs.next }}"
        VERSION="${VERSION#v}"
        sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml

    - name: Commit version bump
      id: bump
      if: steps.release_version.outputs.next != ''
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add pyproject.toml
        git commit -m "chore(release): ${{ steps.release_version.outputs.next }} [skip ci]"
        git push origin HEAD:main
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Build package
      if: steps.release_version.outputs.next != ''
      run: python -m build

    - name: Create GitHub Release
      if: ${{steps.release_version.outputs.next != ''}}
      uses: actions/github-script@v9
      with:
        script: | 
          const { data: release } = await github.rest.repos.createRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            tag_name: '${{steps.release_version.outputs.next}}',
            // The bump commit this job built, not whatever main points at by now
            target_commitish: '${{ steps.bump.outputs.sha }}',
            name: '${{steps.release_version.outputs.next}}',
            generate_release_notes: true
          });
          console.log(`Created release ${release.id} at ${release.html_url}`);  

    - name: Publish to PyPI
      if: ${{steps.release_version.outputs.next != ''}}
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_TOKEN }}

    - name: Move the major version tag
      # Workflows use the GitHub Action as datablock-dev/dbt-ci@v1, so v1 has to follow
      # the latest 1.x release. It moves only once the release is on PyPI.
      if: ${{steps.release_version.outputs.next != ''}}
      env:
        VERSION: ${{ steps.release_version.outputs.next }}
        SHA: ${{ steps.bump.outputs.sha }}
      run: |
        MAJOR="${VERSION%%.*}"
        git tag -f "$MAJOR" "$SHA"
        git push -f origin "refs/tags/$MAJOR"