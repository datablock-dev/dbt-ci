name: Publish to PyPI (Reusable)

on:
  workflow_call:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
        persist-credentials: true
        token: ${{ secrets.ORG_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
        pip install -e ".[dev]"

    - name: Run tests
      run: |
        pytest -v --cov=src --cov-report=xml --cov-report=term

    - name: Determine next release version
      id: release_version
      uses: ietf-tools/semver-action@v1.11.0
      with:
        token: ${{ secrets.ORG_TOKEN }}
        patchAll: true
        noVersionBumpBehavior: patch
        fallbackTag: v1.0.0

    - name: Bump version in pyproject.toml
      if: steps.release_version.outputs.next != ''
      run: |
        VERSION="${{ steps.release_version.outputs.next }}"
        VERSION="${VERSION#v}"
        sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml

    - name: Commit version bump
      if: steps.release_version.outputs.next != ''
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add pyproject.toml
        git commit -m "chore(release): ${{ steps.release_version.outputs.next }} [skip ci]"
        git push origin HEAD:main

    - name: Build package
      if: steps.release_version.outputs.next != ''
      run: python -m build

    - name: Create GitHub Release
      if: ${{steps.release_version.outputs.next != ''}}
      uses: actions/github-script@v7
      with:
        script: | 
          const { data: release } = await github.rest.repos.createRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            tag_name: '${{steps.release_version.outputs.next}}',
            target_commitish: 'main',
            name: '${{steps.release_version.outputs.next}}',
            generate_release_notes: true
          });
          console.log(`Created release ${release.id} at ${release.html_url}`);  

    - name: Publish to PyPI
      if: ${{steps.release_version.outputs.next != ''}}
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_TOKEN }}