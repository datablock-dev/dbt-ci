name: Publish to PyPI

on:
  push:
    branches: [ main ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
        persist-credentials: true
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install python-semantic-release
        pip install -e ".[dev]"
    
    - name: Run tests
      run: |
        pytest -v --cov=src --cov-report=xml --cov-report=term
    
    - name: Python Semantic Release
      id: release
      uses: python-semantic-release/python-semantic-release@v8.3.0
      with:
        # Note: If branch protection is enabled, you need to either:
        # 1. Use a PAT with admin permissions: github_token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
        # 2. Allow github-actions bot to bypass branch protection rules in repository settings
        github_token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Publish to PyPI
      if: steps.release.outputs.released == 'true'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_TOKEN }}
    
    - name: Publish to GitHub Releases
      if: steps.release.outputs.released == 'true'
      uses: python-semantic-release/upload-to-gh-release@main
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ steps.release.outputs.tag }}