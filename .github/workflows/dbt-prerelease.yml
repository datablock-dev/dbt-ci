name: dbt pre-releases

# Runs the tests against the newest dbt releases, pre-releases included, so a dbt
# release that breaks dbt-ci shows up before users upgrade to it. It runs on a schedule
# rather than on pull requests: a dbt pre-release breaking must not block unrelated work.
# A failed scheduled run opens an issue, or comments on the one already open.

on:
  schedule:
    - cron: "17 4 * * 1,4"   # Mondays and Thursdays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dbt-core-1x:
    # dbt-ci imports dbt-core 1.x, so the newest 1.x runs in dbt-ci's own environment,
    # like the regular test matrix: unit and end-to-end tests.
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install dbt-ci
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Install the newest dbt-core 1.x
      run: |
        version="$(python .github/scripts/latest_release.py dbt-core --below 2)"
        # Pinned exactly, so only dbt-core may be a pre-release, not its dependencies
        pip install dbt-duckdb "dbt-core==$version"
        dbt --version
        echo "Tested dbt-core $version" >> "$GITHUB_STEP_SUMMARY"

    - name: Install the latest stable dbt-core 1.x for the upgrade case
      run: |
        python -m venv "$RUNNER_TEMP/dbt-stable"
        "$RUNNER_TEMP/dbt-stable/bin/pip" install "dbt-core<2" dbt-duckdb

    - name: Run tests
      run: |
        export DBT_CI_E2E_DBT_BINARY="$(command -v dbt)"
        pytest -v

    - name: Run end-to-end tests against state built by the latest stable dbt-core 1.x
      run: |
        export DBT_CI_E2E_DBT_BINARY="$(command -v dbt)"
        export DBT_CI_E2E_REFERENCE_DBT_BINARY="$RUNNER_TEMP/dbt-stable/bin/dbt"
        pytest -v tests/e2e/test_dbt_versions.py

  dbt-v2:
    # dbt v2 installs its own `dbt` executable, so it gets its own environment and
    # dbt-ci drives it through the local runner. It ships as `dbt`, and its open-source
    # build as `dbt-core` 2.x.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: dbt
            bounds: ""
          - package: dbt-core
            bounds: "--from 2"

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install dbt-ci
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Install the newest ${{ matrix.package }} in its own environment
      run: |
        version="$(python .github/scripts/latest_release.py ${{ matrix.package }} ${{ matrix.bounds }})"
        python -m venv "$RUNNER_TEMP/dbt-v2"
        "$RUNNER_TEMP/dbt-v2/bin/pip" install "${{ matrix.package }}==$version"
        "$RUNNER_TEMP/dbt-v2/bin/dbt" --version
        echo "Tested ${{ matrix.package }} $version" >> "$GITHUB_STEP_SUMMARY"

    - name: Install the latest stable dbt-core 1.x for the upgrade case
      run: |
        python -m venv "$RUNNER_TEMP/dbt-v1"
        "$RUNNER_TEMP/dbt-v1/bin/pip" install "dbt-core<2" dbt-duckdb

    - name: Run end-to-end tests
      run: |
        export DBT_CI_E2E_DBT_BINARY="$RUNNER_TEMP/dbt-v2/bin/dbt"
        pytest -v tests/e2e

    - name: Run end-to-end tests against state built by dbt-core 1.x
      run: |
        export DBT_CI_E2E_DBT_BINARY="$RUNNER_TEMP/dbt-v2/bin/dbt"
        export DBT_CI_E2E_REFERENCE_DBT_BINARY="$RUNNER_TEMP/dbt-v1/bin/dbt"
        pytest -v tests/e2e/test_dbt_versions.py

  report:
    # Only scheduled runs: a manual run is watched by whoever started it
    needs: [dbt-core-1x, dbt-v2]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    permissions:
      issues: write

    steps:
    - name: Open or update the tracking issue
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        title="Tests fail against an upcoming dbt release"
        body="The scheduled run against the newest dbt releases failed: $RUN_URL (its summary lists the dbt versions tested)."
        number="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')"
        if [ -n "$number" ]; then
          gh issue comment "$number" --body "$body"
        else
          gh issue create --title "$title" --body "$body Later failures comment here until the issue is closed."
        fi
