name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  action-smoke:
    uses: ./.github/workflows/action-smoke.yml

  pypi:
    # The release also moves the v1 tag the GitHub Action is used through
    needs: [tests, action-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/publish-pypi.yml
    secrets: inherit