name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  action-smoke:
    uses: ./.github/workflows/action-smoke.yml

  pypi:
    # The release also moves the v1 tag the GitHub Action is used through
    needs: [tests, action-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/publish-pypi.yml
    secrets: inherit

  docker:
    # Images go out once the release is on PyPI, built from the release commit
    needs: pypi
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      push_images: true
