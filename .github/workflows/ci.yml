name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

# One run at a time per branch, so merges to main queue instead of testing and releasing
# in parallel. A running release is never cancelled. GitHub keeps only one run waiting:
# a newer merge replaces it, and the release still covers that merge because it checks
# out the latest main. The group is a literal name, not github.workflow, because the
# called workflows see this workflow's name and a group built from it there would deadlock.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  action-smoke:
    uses: ./.github/workflows/action-smoke.yml

  pypi:
    # The release also moves the v1 tag the GitHub Action is used through
    needs: [tests, action-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/publish-pypi.yml
    secrets: inherit