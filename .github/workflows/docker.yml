name: Build and Push Docker Images (Reusable)

on:
  workflow_call:
    inputs:
      push_images:
        description: 'Whether to push images to registry'
        required: false
        type: boolean
        default: true
  # Pull requests that change the image build it without pushing, so a broken
  # Dockerfile fails the pull request instead of the release
  pull_request:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'pyproject.toml'
      - '.github/workflows/docker.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    
    strategy:
      fail-fast: false
      matrix:
        # Only include the LATEST patch version of each minor dbt-core version
        # When a new patch is released (e.g., 1.10.14), replace the old one (1.10.13)
        # This keeps the registry clean - each tag gets overwritten with updates
        dbt_version:
          - '1.10.23' # Latest 1.10.x (update this when 1.10.24 is released)
          - '1.11.17' # Latest 1.11.x (update this when 1.11.18 is released)
          - '1.12.7'  # Latest 1.12.x (update this when 1.12.8 is released)
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # A release builds the latest main, like the PyPI job, so the image holds the
          # version-bump commit it published. Pull requests build their own commit.
          ref: ${{ inputs.push_images == true && 'main' || '' }}

      - name: Read the dbt-ci version
        id: version
        run: echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Log in to Container Registry
        if: inputs.push_images == true
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dbt-${{ matrix.dbt_version }}
            type=raw,value=${{ steps.version.outputs.version }}-dbt-${{ matrix.dbt_version }}
            type=raw,value=latest,enable=${{ matrix.dbt_version == '1.12.7' }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ inputs.push_images == true }}
          # Pull requests keep the image locally so the test step can run it
          load: ${{ inputs.push_images != true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DBT_CORE_VERSION=${{ matrix.dbt_version }}
          cache-from: type=gha
          # Pull requests read the cache but leave it to releases to write
          cache-to: ${{ inputs.push_images == true && 'type=gha,mode=max' || '' }}
      
      - name: Test Docker image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dbt-${{ matrix.dbt_version }}
          EXPECTED: ${{ steps.version.outputs.version }}
        run: |
          docker run --rm "$IMAGE" --help
          docker run --rm "$IMAGE" --version | tee version.txt
          grep -F "$EXPECTED" version.txt
          docker run --rm --entrypoint dbt "$IMAGE" --version > dbt-version.txt 2>&1
          grep -F "${{ matrix.dbt_version }}" dbt-version.txt
  
  summary:
    runs-on: ubuntu-24.04
    needs: build-and-push
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build-and-push.result }}" == "success" ]; then
            echo "✅ All Docker images built successfully!"
          else
            echo "❌ Some Docker image builds failed"
            exit 1
          fi