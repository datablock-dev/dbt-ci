name: Build and Push Docker Images (Reusable)

on:
  workflow_call:
    inputs:
      push_images:
        description: 'Whether to push images to registry'
        required: false
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    strategy:
      fail-fast: false
      matrix:
        # Only include the LATEST patch version of each minor dbt-core version
        # When a new patch is released (e.g., 1.10.14), replace the old one (1.10.13)
        # This keeps the registry clean - each tag gets overwritten with updates
        dbt_version:
          - '1.10.13' # Latest 1.10.x (update this when 1.10.14 is released)
          - '1.11.5'  # Latest 1.11.x (update this when 1.11.6 is released)
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        if: inputs.push_images
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dbt-${{ matrix.dbt_version }}
            type=raw,value=latest,enable=${{ matrix.dbt_version == '1.10.13' }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ inputs.push_images }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DBT_CORE_VERSION=${{ matrix.dbt_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Docker image
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dbt-${{ matrix.dbt_version }} --help
  
  summary:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build-and-push.result }}" == "success" ]; then
            echo "✅ All Docker images built successfully!"
          else
            echo "❌ Some Docker image builds failed"
            exit 1
          fi