[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "dbt-ci"
version = "1.3.6"
description = "CI/CD tool for dbt projects with intelligent change detection and selective execution"
authors = [
    {name = "Patrick Tannoury", email = "patrick.tannoury@datablock.dev"},
]
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

# Read dependencies from requirements.txt
dependencies = [    
    "click==8.1.8",
    "pyyaml==6.0.3",
    "dbt-core>=1.10.13,<2.0.0",
    "docker==7.1.0",
    "boto3==1.35.0",
    "google-cloud-bigquery==3.27.0",
    "google-cloud-storage==2.19.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9.0"]
mysql = ["pymysql>=1.0.0"]
dev = [
    "pytest==8.3.5",
    "black==24.10.0",
    "mypy==1.14.1",
    "flake8==7.1.2",
    "duckdb==1.2.0",
    "slack-sdk==3.36.0",
    "pytest-cov==6.0.0",
    "pytest-mock==3.14.0",
]

[project.scripts]
dbt-ci = "dbt_ci.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["dbt_ci*"]

[tool.setuptools.package-data]
dbt_ci = ["py.typed", "**/*.yaml"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
build_command = "pip install build && python -m build"
commit_message = "chore(release): {version} [skip ci]"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
template_dir = "templates"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.black]
line-length = 100
target-version = ['py312']