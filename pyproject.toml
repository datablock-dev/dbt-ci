[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "dbt-ci"
version = "1.5.4"
description = "CI/CD tool for dbt projects with intelligent change detection and selective execution"
authors = [
    {name = "Patrick Tannoury", email = "patrick.tannoury@datablock.dev"},
]
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

# Kept deliberately small: dbt-ci is installed alongside a user's dbt project, so exact
# pins here turn into resolver conflicts with their adapters. Cloud SDKs and the Docker
# client live in extras because a given project needs at most one of them.
dependencies = [
    "click>=8.1,<9",
    "pyyaml>=6.0,<7",
    "dbt-core>=1.10.13,<2.0.0",
    "slack-sdk>=3.27,<4",
]

[project.optional-dependencies]
# Cloud storage / warehouse connectors
gcp = [
    "google-cloud-bigquery>=3.20,<4",
    "google-cloud-storage>=2.14,<4",
]
aws = ["boto3>=1.34,<2"]
# Docker runner
docker = ["docker>=7.0,<8"]
all = [
    "dbt-ci[gcp]",
    "dbt-ci[aws]",
    "dbt-ci[docker]",
]
postgres = ["psycopg2-binary>=2.9.0"]
mysql = ["pymysql>=1.0.0"]
dev = [
    "dbt-ci[all]",
    "pytest==9.1.1",
    "black==26.5.1",
    "mypy==2.3.0",
    "flake8==7.3.0",
    "duckdb==1.5.5",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
]

[project.scripts]
dbt-ci = "dbt_ci.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["dbt_ci*"]

[tool.setuptools.package-data]
dbt_ci = ["py.typed", "**/*.yaml"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
build_command = "pip install build && python -m build"
commit_message = "chore(release): {version} [skip ci]"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
template_dir = "templates"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.black]
line-length = 100
target-version = ['py312']