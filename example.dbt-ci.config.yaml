# yaml-language-server: $schema=./dbt-ci.config.schema.json
project_dir: "dbt"
profiles_dir: "dbt"
state: "dbt/reference_manifest.json"
runner: "docker"

init:
  comparison-strategy: "git"

run:
  # Retry a failed step with `dbt retry`, which reruns only the nodes that failed
  retries: 1

finalize:
  files:
    - "manifest"
    - "cache"

docker:
  image: "my-registry/dbt:latest"
  volumes:
    - "dbt:/path-in-your-container:rw"
    - "${GOOGLE_APPLICATION_CREDENTIALS}:${GOOGLE_APPLICATION_CREDENTIALS}:ro"
  env:
    - "DBT_PROFILES_DIR=/dbt"
    - "USER=${USER}"
    - "DBT_STATE=${DBT_STATE}"

# Settings for one CI event, applied over the top-level settings above
on:
  # Scheduled runs (e.g. a nightly build) only use this block, never `push`'s
  schedule:
    run:
      retries: 2
    notifications:
      format: "compact"
